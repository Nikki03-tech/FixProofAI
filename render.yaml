services:
  # Python API backend
  - type: web
    name: fixproof-ai-api
    runtime: python
    rootDir: .
    buildCommand: pip install -r Backend/requirements.txt
    startCommand: uvicorn Backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: BHARATCODE_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://fixproof-ai-frontend.onrender.com
      - key: PYTHON_VERSION
        value: 3.12.8

  # React frontend
  - type: web
    name: fixproof-ai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://fixproof-ai-api.onrender.com
