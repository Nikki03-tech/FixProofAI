services:
  # FastAPI backend
  - type: web
    name: fixproof-ai-api
    runtime: python
    rootDir: .
    buildCommand: pip install -r Backend/requirements.txt
    startCommand: uvicorn Backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: FRONTEND_ORIGIN
        value: https://fixproofai.onrender.com
      - key: MAX_CODE_LENGTH
        value: "20000"
      - key: REQUEST_TIMEOUT
        value: "90"
      - key: ANALYZE_RATE_LIMIT_PER_MINUTE
        value: "5"
      - key: PYTHON_VERSION
        value: 3.12.8

  # React + Vite frontend (separate static service)
  - type: web
    name: fixproof-ai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://fixproof-ai-api.onrender.com
